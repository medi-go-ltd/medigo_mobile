name: medigo_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.0-0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  geolocator: ^13.0.1
  google_maps_flutter: ^2.5.0
  geocoding: ^3.0.0
  google_polyline_algorithm: ^3.1.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.2
  cloud_firestore: ^5.4.3
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  path: ^1.9.0
  url_launcher: ^6.2.5
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/body_map/
    - assets/mock_data/

  fonts:
    - family: MedigoSans
      fonts:
        - asset: assets/fonts/MedigoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/MedigoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/MedigoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/MedigoSans-Bold.ttf
          weight: 700  

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app-logo.png"
  min_sdk_android: 21 
  adaptive_icon_background: "#FFFFFF" 
  adaptive_icon_foreground: "assets/images/app-logo.png" 
  remove_alpha_ios: true 
  ios_background_color: "#FFFFFF" 
