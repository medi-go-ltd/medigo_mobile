name: medigo_mobile
description: "Medigo Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.0-0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.5.6
  geolocator: ^14.1.2
  google_maps_flutter: ^2.19.0
  geocoding: ^5.0.0
  google_polyline_algorithm: ^3.1.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  path: ^1.9.0
  url_launcher: ^6.3.3
  fl_chart: ^1.3.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/registration/
    - assets/images/body_map/
    - assets/mock_data/

  fonts:
    - family: MedigoSans
      fonts:
        - asset: assets/fonts/MedigoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/MedigoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/MedigoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/MedigoSans-Bold.ttf
          weight: 700  

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app-logo.png"
  min_sdk_android: 21 
  adaptive_icon_background: "#FFFFFF" 
  adaptive_icon_foreground: "assets/images/app-logo.png" 
  remove_alpha_ios: true 
  ios_background_color: "#FFFFFF" 
